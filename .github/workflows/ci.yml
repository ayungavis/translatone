name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    name: Format, lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run test

  raycast:
    name: Raycast build and store lint
    runs-on: macos-latest
    needs: check
    defaults:
      run:
        working-directory: apps/raycast
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Generate the standalone npm lockfile for Store validation
        run: |
          STAGE="$(mktemp -d)"
          cp package.json "$STAGE/"
          (cd "$STAGE" && npm install --package-lock-only --ignore-scripts --no-audit --no-fund)
          cp "$STAGE/package-lock.json" .
      - run: bun run lint
